<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
  <title>WhiteChrismas</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div class="widget">
    <header>
      <span class="indicator" aria-hidden="true"></span>
      <button id="toggle" aria-label="겨울 설정 열기" aria-expanded="false" aria-controls="menu">
        <img src="icon.png" alt="" draggable="false">
      </button>
      <button id="minimize" type="button" aria-label="설정 접기">−</button><div class="window-art" aria-hidden="true"></div>

    </header>
    <main id="menu" hidden>
      <label class="switch master"><span>겨울 모드<small>바탕화면에 겨울을 켜보세요</small></span><input id="enabled" type="checkbox"></label>
      <fieldset id="options" disabled>
        <section class="controls" aria-label="눈 설정"><h2>❄ 눈 설정</h2>
          <label class="switch"><span>눈 내리기</span><input id="snow" type="checkbox"></label>
          <label class="slider"><span>강설량 <output id="intensity-value"></output></span><input id="intensity" type="range" min="0" max="100"></label>
          <label class="slider"><span>바람 <output id="wind-value"></output></span><input id="wind" type="range" min="-100" max="100"></label>
          <label class="switch secondary"><span>작업표시줄 위에 눈 쌓기</span><input id="taskbar" type="checkbox"></label>
          <label class="slider"><span>눈덩이 최대 크기 <output id="maxBallSize-value"></output></span><input id="maxBallSize" type="range" min="40" max="120" step="1" value="80"></label><small>모아서 키울 수 있는 최대 지름입니다.</small>
        </section>
        <section class="group" aria-label="겨울 놀이">
          <h2>겨울 놀이</h2>
          <div class="actions">
            <button data-action="clear"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 5.5h8.5L14 9v3H2z"/><circle cx="5" cy="12.5" r="1.3"/><circle cx="11" cy="12.5" r="1.3"/></svg>제설차 부르기</button>
            <button data-action="snowball"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.8"/><path d="M5 6.2a3.6 3.6 0 0 1 2-1.7"/></svg>눈덩이 만들기</button>
            <button data-action="reset"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.2 8A5.2 5.2 0 1 1 11.6 4.3M13.2 2.4v3h-3"/></svg>쌓인 눈 초기화</button>
          </div>
        </section>
        <section class="group decor" aria-label="겨울 장식">
          <h2>겨울 장식</h2>
          <div class="palette">
            <label for="lights">전구</label>
            <div class="select"><i class="swatch" data-palette="classic" aria-hidden="true"></i>
              <select id="lights"><option value="classic">크리스마스 색상</option><option value="warm">따뜻한 흰색</option><option value="ice">차가운 파랑</option><option value="holly">빨강과 초록</option></select></div>
            <input id="light-color" type="color" value="#ffb85c" aria-label="전구 색상 직접 선택" title="원하는 전구 색상 선택">
          </div>
          <div class="actions">
            <button data-action="garland"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 3.5c2.5 7 10.500 7 13 0"/><circle cx="4.800" cy="8.600" r="1.100"/><circle cx="8" cy="10" r="1.100"/><circle cx="11.200" cy="8.600" r="1.100"/></svg>전구 줄 달기</button>
            <button data-action="tree"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.500l3.200 4.300H9.400l2.800 3.700H3.800l2.800-3.700H4.800zM8 9.500v4"/></svg>트리 놓기</button>
            <button data-action="lantern">랜턴 놓기</button>
            <button data-action="snack">군고구마 놓기</button>
            <button data-action="decor-reset"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>장식 치우기</button>
          </div>
        </section>
        <p class="hint">눈 위를 클릭 없이 쓸면 눈이 흩어집니다. 클릭한 채 굴리면 눈덩이를 만듭니다.</p>
      </fieldset>
      <button id="hide-widget" type="button"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.500 6l4.500 4.500L12.500 6"/></svg>트레이로 숨기기</button>
      <p class="credit">Wintermas 기반 · 현빗 커스텀</p><p id="message" role="status"></p>
    </main>
  </div>
  <script type="module" src="panel.js"></script>
</body>
</html>
